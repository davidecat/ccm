# Config tmux dedicata a ccm (socket "ccm"): non tocca un eventuale ~/.tmux.conf

set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB,gnome*:RGB"
set -s extended-keys on
set -as terminal-features ",xterm*:extkeys"
set -s escape-time 10
set -g focus-events on
set -g history-limit 50000
set -g base-index 1
set -g renumber-windows on
set -g allow-rename off
set -g automatic-rename off

# Mouse: click sulle schede per cambiare sessione, rotella per scorrere.
# Selezione nativa del terminale: tieni premuto Shift mentre trascini.
set -g mouse on
set -s copy-command "wl-copy"
bind -T copy-mode MouseDragEnd1Pane send -X copy-pipe-and-cancel
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel

# Titolo della finestra di gnome-terminal
set -g set-titles on
set -g set-titles-string "Claude · #W"

# Tasti senza prefisso (F1 è l'aiuto di gnome-terminal, quindi si parte da F2)
bind -n F2 choose-tree -Zw -F "#{E:@cc_fmt}#{?#{@cc_state},#{@cc_state},-}#[default]  #{pane_current_path}"
bind -n F3 command-prompt -p "Nome:,Cartella:" -I ",#{pane_current_path}" "run-shell -b \"TMUX=#{socket_path},0,0 $HOME/.local/bin/ccm new -n '%1' '%2'\""
bind -n F4 confirm-before -p "Chiudere la sessione '#W'? (y/n)" kill-window
bind -n F5 previous-window
bind -n F6 next-window
# F7: nome scelto a mano, quindi niente più nome automatico dal titolo della sessione
bind -n F7 command-prompt -I "#W" -p "Rinomina:" "rename-window '%%' ; set -w @cc_autoname 0"

# Stato impostato dagli hook di Claude Code (@cc_state per finestra)
set -g @cc_fmt "#{?#{==:#{@cc_state},waiting},#[bg=colour226#,fg=colour16#,bold] ? ,#{?#{==:#{@cc_state},working},#[fg=colour39] ◐ ,#{?#{==:#{@cc_state},done},#[fg=colour46] ✔ ,   }}}"

set -g status-position bottom
set -g status-interval 2
set -g status-style "bg=colour235,fg=colour250"
set -g status-left "#[bg=colour130,fg=colour231,bold] Claude #[default] "
set -g status-left-length 20
set -g status-right "#[fg=colour244]F2 lista · F3 nuova · F4 chiudi · F5/F6 ←→ · F7 rinomina "
set -g status-right-length 80
set -g window-status-separator ""
# Nomi lunghi (titoli di sessione) accorciati a 30 caratteri nella barra
set -g window-status-format "#{E:@cc_fmt}#I:#{=/30/…:window_name} #[default]"
set -g window-status-current-format "#[bg=colour240]#{E:@cc_fmt}#[bg=colour240#,bold]#I:#{=/30/…:window_name} #[default]"
set -g message-style "bg=colour130,fg=colour231"

# Se claude esce con errore la scheda resta aperta per leggere il messaggio
set -g remain-on-exit failed

# Ridisegna Claude dopo ogni ridimensionamento della finestra (vedi ccm redraw)
set-hook -g client-resized 'run-shell -b "$HOME/.local/bin/ccm redraw"'
